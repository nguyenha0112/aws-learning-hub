<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Học IAM</title><style>body{font:17px/1.65 system-ui;max-width:800px;margin:auto;padding:28px}h1{color:#ec7211}article{border-left:4px solid #ec7211;padding-left:16px}</style><body><a href="../../../index.html">← Hub</a><h1>IAM</h1><article><p><b>Phân biệt nhanh:</b> User là danh tính; Role là bộ quyền tạm thời; Policy là luật cấp quyền.</p></article><h2>Scenario</h2><p>EC2 cần đọc object trong S3: gắn IAM role vào EC2, không nhét access key trong code.</p><h2>Nhớ khi thi</h2><p>Explicit deny thắng mọi allow. Root user không thể bị giới hạn bởi IAM policy.</p></body></html>
